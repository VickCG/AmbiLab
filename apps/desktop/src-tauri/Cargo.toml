[package]
name = "ambilab-desktop"
description = "AmbiLab IDE - Desktop Application"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
ambilab-core = { path = "../../../packages/core" }

# ── UI framework ─────────────────────────────────────────────────────────────
tauri = { version = "1.6", features = ["dialog-all", "fs-all", "path-all", "shell-open"] }

# ── Query engine ──────────────────────────────────────────────────────────────
# bundled = embeds DuckDB from source (self-contained binary, ~15min first build)
# arrow is a required (always-on) dependency in duckdb 1.x — no feature flag needed
duckdb = { version = "1", features = ["bundled"] }

# ── Apache Arrow — zero-copy columnar pipeline ────────────────────────────────
arrow        = { version = "53", default-features = false, features = ["csv", "json", "ipc"] }
arrow-array  = "53"
arrow-schema = "53"
arrow-ipc    = "53"
arrow-buffer = "53"
parquet      = { version = "53", default-features = false, features = ["arrow"] }

# ── Concurrency ───────────────────────────────────────────────────────────────
crossbeam-channel = "0.5"   # bounded channels for backpressure
crossbeam-utils   = "0.8"   # AtomicCell, Backoff
parking_lot       = "0.12"  # 2-3x faster than std Mutex/RwLock
rayon             = "1.8"   # work-stealing parallelism for CPU tasks

# ── Async (AI + IO only — never for DuckDB) ───────────────────────────────────
tokio   = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }  # AI HTTP calls
futures = "0.3"

# ── Memory & performance ──────────────────────────────────────────────────────
bumpalo    = "3"     # per-query arena allocator — O(1) bulk free
slab       = "0.4"   # pre-allocated slab for same-type objects
smallvec   = "1.11"  # stack-allocated Vec for small collections
rustc-hash = "2"     # FxHashMap — fastest hash for local keys (no DoS risk)

# ── Caching ───────────────────────────────────────────────────────────────────
lru     = "0.12"  # LRU result cache (512MB cap)
dashmap = "5"     # concurrent HashMap for multi-threaded cache access

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"

# ── Observability ─────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# ── File IO ───────────────────────────────────────────────────────────────────
memmap2 = "0.9"                             # OS-level lazy file loading
csv     = "1.3"                             # CSV parsing (pre-DuckDB path)
chrono  = { version = "0.4", features = ["serde"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
once_cell = "1.19"  # one-time global init
sha2      = "0.10"  # file fingerprinting for cache keys

[dev-dependencies]
tempfile  = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }  # benchmarks

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ── Release: maximum optimization ─────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "fat"      # cross-crate link-time optimization
codegen-units = 1          # single codegen unit = best optimization
panic         = "abort"    # no unwinding overhead
strip         = true       # remove debug symbols from binary

# ── Dev: fast iteration ───────────────────────────────────────────────────────
[profile.dev]
opt-level   = 1    # minimal optimization for fast rebuilds
incremental = true
