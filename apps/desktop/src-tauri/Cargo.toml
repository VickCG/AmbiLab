[package]
name = "ambilab-desktop"
description = "AmbiLab IDE - Desktop Application"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
ambilab-core = { path = "../../../packages/core" }
tauri = { version = "1.6", features = ["dialog-all", "fs-all", "path-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
csv = "1.3"
arrow = { version = "53", default-features = false, features = ["csv", "json"] }
parquet = { version = "53", default-features = false, features = ["arrow"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
