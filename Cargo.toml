[workspace]
resolver = "2"
members = [
    "packages/core",
    "apps/desktop/src-tauri",
    "tools/datagen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AmbiLab Team"]
license = "MIT"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
incremental = true
