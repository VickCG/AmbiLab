[package]
name = "ambilab-core"
description = "AI-Powered Local Analytics IDE - Core analytical engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ambilab_core"
path = "src/lib.rs"

[dependencies]
sqlparser = "0.43"
petgraph = "0.6"
thiserror = "1.0"
smallvec = { version = "1.13", features = ["const_generics"] }
rustc-hash = "1.1"
parking_lot = "0.12"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

